[project]
name = "job-radar"
version = "0.1.0"
description = "Daily remote-job digest: fetch, pre-filter, LLM-score, deliver over Telegram."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
